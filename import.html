<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Catan analytics</title>
  <style>
    body {
      align-items: center;
      background: #f7f2e7;
      color: #25190d;
      display: flex;
      font: 16px/1.5 Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      background: #fff;
      border: 1px solid #e5dac7;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(61, 41, 14, 0.12);
      max-width: 520px;
      padding: 28px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    p {
      margin: 0;
    }

    #status.is-error {
      color: #a61b1b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening Catan analytics</h1>
    <p id="status" role="status" aria-live="polite">Sending the board securely…</p>
  </main>
  <script src="import.js"></script>
</body>
</html>
